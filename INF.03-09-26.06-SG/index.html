<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restauracja Marchewka</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <section id="headerleft">
            <h1>Restauracja Marchewka</h1>
            <h3>Twoje wegetariańskie miejsce na mapie miasta</h3>
        </section>
        <section id="headerright">
            <img src="logo.png" alt="logo">
        </section>
    </header>
    <main>
        <section id="mainleft">
            <h4>Twoje zamówienie</h4>
            <ul id="orderlist"></ul>
            <button>Wyczyść</button>
            <button>Zatwierdź</button>
        </section>
        <section id="mainright">
            <div class="dih">
                <img src="nalesniki.webp" alt="Naleśniki">
                <p>Naleśniki</p>
            </div>
            <div class="dih">
                <img src="lasagne.webp" alt="Lasagne szpinakowa">
                <p>Lasagne szpinakowa</p>
            </div>
            <div class="dih">
                <img src="marchewka.webp" alt="Pieczona marchewka">
                <p>Pieczona marchewka</p>
            </div>
            <div class="dih">
                <img src="rosol.webp" alt="Wege rosół">
                <p>Wege rosół</p>
            </div>
            <div class="dih">
                <img src="tarta.webp" alt="Tarta szparagowa">
                <p>Tarta szparagowa</p>
            </div>
            <div class="dih">
                <img src="kompot.webp" alt="Kompot">
                <p>Kompot</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Wykonał: xxxxxxxxxx</p>
    </footer>
</body>
</html>
